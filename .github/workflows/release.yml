name: Release

# Tag-driven release: bump the version, commit, then push a matching tag (e.g. v1.2.3).
# Publishes through npm trusted publishing (GitHub OIDC): no npm token or repo secret.
on:
  # Proof only, no publish: npm trusts this workflow file whatever its trigger, so a manual run exchanges the
  # job's OIDC token per package and says which package npm would refuse (.github/scripts/npm-trust-proof.mjs).
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  npm-trust-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token npm exchanges; nothing is published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Exchange the OIDC token with npm for every public package
        run: node .github/scripts/npm-trust-proof.mjs --out npm-trust-proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-trust-proof
          path: npm-trust-proof.json

  npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}" >&2
            exit 1
          fi

      - name: npm 11 for trusted publishing
        run: npm install -g npm@11.12.1

      - name: npm publish of each version npm lacks; one npm already serves with the same contents is skipped
        id: already-published
        env:
          NPM_CONFIG_PROVENANCE: true
        run: node .github/scripts/npm-publish-new.mjs --dir . --out already-published.json

  github-release:
    needs: [npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes
